# docker-compose.yml - Self-hosted nc-mineman deployment
# Usage: docker compose up -d

services:
  # ============================================
  # CADDY REVERSE PROXY
  # Automatic HTTPS with Let's Encrypt
  # ============================================
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 support
      - "25565:25565"  # Minecraft port (optional)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - nc-mineman-network
    depends_on:
      - nc-mineman
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # NC-MINEMAN APPLICATION
  # Next.js Minecraft Server Manager
  # ============================================
  nc-mineman:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nc-mineman
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      # Pass through environment variables from .env
      - APP_URL=${APP_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - WORKOS_CLIENT_ID=${WORKOS_CLIENT_ID}
      - WORKOS_API_KEY=${WORKOS_API_KEY}
      - WORKOS_REDIRECT_URI=${WORKOS_REDIRECT_URI}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - SPACETIMEDB_ENABLED=${SPACETIMEDB_ENABLED:-true}
      - SPACETIMEDB_PORT=${SPACETIMEDB_PORT:-3001}
      - SPACETIMEDB_HOST=${SPACETIMEDB_HOST:-127.0.0.1}
    volumes:
      - nc-mineman_data:/app/data
      - nc-mineman_servers:/app/servers
      - nc-mineman_backups:/app/backups
      - nc-mineman_logs:/app/logs
    networks:
      - nc-mineman-network
    # Minecraft server requires elevated capabilities
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # SPACETIMEDB (Optional - External)
  # Uncomment if you want SpacetimeDB in a container
  # ============================================
  # spacetimedb:
  #   image: ghcr.io/clockworklabs/spacetime:latest
  #   container_name: spacetimedb
  #   restart: unless-stopped
  #   ports:
  #     - "3001:3001"
  #   volumes:
  #     - spacetimedb_data:/spacetimedb
  #   networks:
  #     - nc-mineman-network
  #   command: ["spacetimedb", "start", "--listen", "0.0.0.0:3001"]

  # ============================================
  # MINECRAFT SERVER (Optional)
  # Example Minecraft server container
  # ============================================
  # minecraft:
  #   image: itzg/minecraft-server:java21
  #   container_name: minecraft
  #   restart: unless-stopped
  #   environment:
  #     EULA: "TRUE"
  #     TYPE: PAPER
  #     VERSION: "1.21"
  #     MEMORY: "4G"
  #     SERVER_PORT: 25565
  #     RCON_PORT: 25575
  #     ENABLE_RCON: "true"
  #     RCON_PASSWORD: ${RCON_PASSWORD:-minecraft}
  #   ports:
  #     - "25565:25565"
  #     - "25575:25575"
  #   volumes:
  #     - minecraft_data:/data
  #   networks:
  #     - nc-mineman-network
  #   stdin_open: true
  #   tty: true

networks:
  nc-mineman-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  nc-mineman_data:
  nc-mineman_servers:
  nc-mineman_backups:
  nc-mineman_logs:
